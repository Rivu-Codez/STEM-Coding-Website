name: Quality checks

on:
  push:
    branches: [master, feature/platform-stabilization]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned project tools
        run: npm install

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run repository checks
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Check Edge Function contract
        run: deno test --allow-read --config supabase/functions/analyze-mistake/deno.json supabase/functions/analyze-mistake/index.test.ts

      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f supabase/config.toml
          test -f supabase/functions/analyze-mistake/index.ts
          test -f login.html
          test -f PhysicsSim/index.html
          test -f RoboMaze/index.html

      - name: Scan tracked files for common secret names
        shell: bash
        run: |
          secret_pattern=$(printf '%s' 'service_' 'role|SUPABASE_' 'SERVICE_ROLE_KEY|GEMINI_API_KEY[[:space:]]*' '=')
          if git grep -n -I -E "$secret_pattern" -- ':!README.md' ':!.env.example'; then
            echo "Potential secret material found in tracked files."
            exit 1
          fi
