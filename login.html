<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboLogic STEM Lab | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/game-platform.js"></script>
  <script src="js/auth-api.js"></script>
  <script src="js/progress-api.js"></script>
  <script src="js/achievement-api.js"></script>
  <script src="js/mistake-api.js"></script>
  <script src="js/tutor-api.js"></script>
  <script src="js/game-auth.js"></script>
</head>
<body>
  <main class="auth-card">
    <section id="loginPanel">
      <div class="brand">⚙ ROBOLOGIC STEM LAB</div>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authDescription">Log in to continue your learning journey.</p>
      <form id="authForm" class="auth-form">
        <label for="loginEmail">Email address</label>
        <input id="loginEmail" type="email" placeholder="Student email" autocomplete="email">
        <div id="displayNameRow" hidden>
          <label for="displayName">Display name</label>
          <input id="displayName" type="text" placeholder="What should we call you?" autocomplete="name" maxlength="60">
        </div>
        <label for="loginPassword">Password</label>
        <div class="password-wrap">
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
          <button id="togglePassword" type="button">Show</button>
        </div>
        <p id="passwordRules" class="password-rules" hidden>Use at least 6 characters.</p>
        <div id="confirmRow" hidden>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat password" autocomplete="new-password">
        </div>
        <button id="authSubmit" type="submit">Log in</button>
        <p id="loginMessage" class="auth-message" aria-live="polite"></p>
        <button id="modeToggle" type="button" class="secondary">Need an account? Create one</button>
      </form>
    </section>
  </main>
  <script>window.addEventListener("load", () => StemGameAuth.initLoginPage());</script>
</body>
</html>
